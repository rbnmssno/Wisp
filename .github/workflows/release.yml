name: Release

# When a release is published, build the disk image from the tagged source and attach it.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build the app and the disk image
        run: scripts/build.sh
      - name: Attach Wisp.dmg to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/Wisp.dmg --clobber
